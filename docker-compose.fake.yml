# Offline: Odoo + Postgres + app (+ fake Shopify from Phase 1). No accounts needed.
#   docker compose -f docker-compose.fake.yml up
# Every port is bound to 127.0.0.1, so the local-only default passwords below are
# never reachable from another machine. Override any of them in .env.
name: writers-ledger

x-shopify-apps: &shopify-apps
  SHOPIFY_STORE: http://fake-shopify:8080
  SHOPIFY_CLIENT_ID: writers-ledger
  SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-local-only-ledger-secret}
  STOCK_SYNC_CLIENT_ID: stock-sync
  STOCK_SYNC_CLIENT_SECRET: ${STOCK_SYNC_CLIENT_SECRET:-local-only-stock-sync-secret}
  PRICING_TOOL_CLIENT_ID: pricing-tool
  PRICING_TOOL_CLIENT_SECRET: ${PRICING_TOOL_CLIENT_SECRET:-local-only-pricing-tool-secret}

x-postgres-client: &postgres-client
  PGHOST: db
  PGUSER: odoo
  PGPASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres}
  ODOO_DB: ${ODOO_DB:-writers}

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  odoo-init:
    image: odoo:19.0-20261015
    entrypoint: ["bash", "/init.sh"]
    environment:
      <<: *postgres-client
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-local-only-admin}
    volumes:
      - ./odoo/init.sh:/init.sh:ro
      - odoo-data:/var/lib/odoo
    depends_on:
      db:
        condition: service_healthy

  odoo:
    image: odoo:19.0-20261015
    command: ["--database=${ODOO_DB:-writers}", "--db-filter=^${ODOO_DB:-writers}$$", "--no-database-list"]
    environment: *postgres-client
    volumes:
      - odoo-data:/var/lib/odoo
    ports:
      - "127.0.0.1:8069:8069"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8069/web/health"]
      interval: 10s
      retries: 30
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot, run by `make seed` (script on stdin). Starts as root only to give the
  # key volumes to the odoo user, then runs Odoo's shell as that user.
  seed:
    image: odoo:19.0-20261015
    profiles: ["tools"]
    user: root
    entrypoint: ["bash", "-c", "install -d -o odoo -g odoo -m 0750 /secrets/collector /secrets/writers && exec runuser -u odoo -- odoo shell -d \"$$ODOO_DB\" --no-http --log-level=warn"]
    environment: *postgres-client
    volumes:
      - ./sim:/opt/writers-ledger/sim:ro
      - odoo-data:/var/lib/odoo
      - odoo-collector-key:/secrets/collector
      - odoo-writer-keys:/secrets/writers
    depends_on:
      odoo:
        condition: service_healthy

  # Plays Shopify offline: Admin API answers and signed webhooks to the app.
  fake-shopify:
    build: .
    command: ["python", "-m", "sim.fake_shopify"]
    environment:
      <<: *shopify-apps
      WEBHOOK_URL: http://app:8000/webhooks/shopify
    volumes:
      - fake-shopify-data:/data  # stock, orders and events survive rebuilds, like a real store
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-shot, run by `make traffic`: simulated days of writes from every writer.
  traffic:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "sim.traffic"]
    environment:
      <<: *shopify-apps
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-writers}
    volumes:
      - odoo-writer-keys:/secrets:ro  # the writers' keys; only this one-shot container mounts them
    group_add: ["101"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    environment:
      <<: *shopify-apps
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_CLIENT_SECRET:-local-only-ledger-secret}
      APP_USER: ${APP_USER:-reviewer}
      APP_PASSWORD: ${APP_PASSWORD:-local-only-demo}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-writers}
      POLL_SECONDS: ${POLL_SECONDS:-10}
      LEDGER_DB: /data/ledger.db
    volumes:
      - ./writers.yaml:/srv/writers.yaml:ro
      - app-data:/data
      - odoo-collector-key:/secrets:ro  # the read-only collector key, nothing else
    group_add: ["101"]  # the odoo group, which may read the key file
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      retries: 10
    depends_on:
      odoo:
        condition: service_healthy
      fake-shopify:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  app-data:
  odoo-collector-key:
  odoo-writer-keys:
  fake-shopify-data:
